# Free demo deployment: SQLite recreated with demo data on every start.
services:
  - type: web
    name: booking-crm-demo
    runtime: docker
    plan: free
    healthCheckPath: /health/
    dockerCommand: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py seed_demo_data && gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-10000}"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "False"
      - key: USE_SQLITE
        value: "True"
      - key: DJANGO_SECRET_KEY
        generateValue: true
