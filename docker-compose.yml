services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booking_crm}
      POSTGRES_USER: ${POSTGRES_USER:-booking_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booking_crm}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"

  celery_worker:
    build: .
    env_file: .env
    depends_on:
      - web
      - redis
    command: celery -A config worker --loglevel=info

  celery_beat:
    build: .
    env_file: .env
    depends_on:
      - web
      - redis
    command: celery -A config beat --loglevel=info

  bot:
    build: .
    env_file: .env
    depends_on:
      - web
    command: python -m bot.main

volumes:
  postgres_data:
