name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking_crm
          POSTGRES_USER: booking_crm
          POSTGRES_PASSWORD: booking_crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U booking_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-secret-key
      POSTGRES_DB: booking_crm
      POSTGRES_USER: booking_crm
      POSTGRES_PASSWORD: booking_crm
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: flake8 apps config bot tests --max-line-length=120 --exclude=migrations

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests
        run: pytest --cov=apps -q
